<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Shieldfort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            display: ['Syne', 'sans-serif'],
          },
          colors: {
            surface: { 950: '#F7F9FC', 900: '#FFFFFF', 800: '#F1F5F9', 700: '#E2E8F0' },
            brand: { 100: '#D2E6F4', 500: '#1C77AD', 600: '#115D91', 700: '#0D4870' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Syne', sans-serif; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp 0.4s ease both; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
  </style>
</head>
<body class="h-full bg-surface-950 flex items-center justify-center p-4">

  <!-- Background subtle grid -->
  <div class="fixed inset-0 opacity-5" style="background-image: linear-gradient(rgba(17,93,145,0.4) 1px, transparent 1px), linear-gradient(90deg, rgba(17,93,145,0.4) 1px, transparent 1px); background-size: 40px 40px;"></div>

  <div class="relative w-full max-w-sm animate-fade-up">

    <!-- Card -->
    <div class="bg-surface-900 border border-surface-700 rounded-2xl overflow-hidden shadow-2xl">

      <!-- Top: logo + brand -->
      <div class="flex items-stretch">
        <!-- Form side -->
        <div class="flex-1 p-8">
          <h1 class="font-display text-xl font-700 text-slate-900 mb-1">Login</h1>
          <p class="text-xs text-slate-500 mb-6">Acesse o painel da empresa</p>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
              <div class="mb-4 px-3 py-2.5 rounded-lg text-xs
                {% if category == 'danger' %}bg-red-50 border border-red-200 text-red-700
                {% else %}bg-brand-100 border border-brand-100 text-brand-700{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endwith %}
          <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
            {{ form.hidden_tag() }}
            <div>
              <label class="block text-xs font-500 text-slate-500 mb-1.5">E-mail</label>
              <input type="email" name="email" required
                class="w-full bg-surface-800 border border-surface-700 rounded-lg px-3 py-2.5 text-sm text-slate-900 placeholder-slate-400
                       focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500/30 transition-all"
                placeholder="seu@email.com" />
            </div>

            <div>
              <label class="block text-xs font-500 text-slate-500 mb-1.5">Senha</label>
              <input type="password" name="senha" required
                class="w-full bg-surface-800 border border-surface-700 rounded-lg px-3 py-2.5 text-sm text-slate-900 placeholder-slate-400
                       focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500/30 transition-all"
                placeholder="••••••••" />
            </div>

            <button type="submit"
              class="w-full mt-2 bg-brand-600 hover:bg-brand-500 active:bg-brand-700 text-white text-sm font-500
                     py-2.5 rounded-lg transition-colors shadow-lg shadow-brand-600/20">
              Entrar
            </button>

          </form>
        </div>

        <!-- Brand side -->
        <div class="w-28 bg-brand-600 flex flex-col items-center justify-center gap-3 p-4">
          <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center overflow-hidden">
            <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="Shieldfort" class="w-full h-full object-contain">
          </div>
          <span class="font-display text-xs font-700 text-white text-center leading-tight">SHIELD<br>FORT</span>
        </div>
      </div>

    </div>

    <p class="text-center text-xs text-slate-500 mt-4">Sistema de Gestão Comercial</p>
  </div>

</body>
</html>
