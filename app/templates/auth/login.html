<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Shieldfort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            display: ['Syne', 'sans-serif'],
          },
          colors: {
            navy: { 950: '#0b0f1a', 900: '#0f1525', 800: '#161d35', 700: '#1e2847' },
            violet: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Syne', sans-serif; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp 0.4s ease both; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
  </style>
</head>
<body class="h-full bg-navy-950 flex items-center justify-center p-4">

  <!-- Background subtle grid -->
  <div class="fixed inset-0 opacity-5" style="background-image: linear-gradient(rgba(139,92,246,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(139,92,246,0.3) 1px, transparent 1px); background-size: 40px 40px;"></div>

  <div class="relative w-full max-w-sm animate-fade-up">

    <!-- Card -->
    <div class="bg-navy-900 border border-navy-700 rounded-2xl overflow-hidden shadow-2xl">

      <!-- Top: logo + brand -->
      <div class="flex items-stretch">
        <!-- Form side -->
        <div class="flex-1 p-8">
          <h1 class="font-display text-xl font-700 text-white mb-1">Login</h1>
          <p class="text-xs text-slate-500 mb-6">Acesse o painel da empresa</p>

          <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">

            <div>
              <label class="block text-xs font-500 text-slate-400 mb-1.5">E-mail</label>
              <input type="email" name="email" required
                class="w-full bg-navy-800 border border-navy-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-slate-600
                       focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500/30 transition-all"
                placeholder="seu@email.com" />
            </div>

            <div>
              <label class="block text-xs font-500 text-slate-400 mb-1.5">Senha</label>
              <input type="password" name="senha" required
                class="w-full bg-navy-800 border border-navy-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-slate-600
                       focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500/30 transition-all"
                placeholder="••••••••" />
            </div>

            <button type="submit"
              class="w-full mt-2 bg-violet-600 hover:bg-violet-500 active:bg-violet-700 text-white text-sm font-500
                     py-2.5 rounded-lg transition-colors shadow-lg shadow-violet-900/40">
              Entrar
            </button>

          </form>
        </div>

        <!-- Brand side -->
        <div class="w-28 bg-navy-800 border-l border-navy-700 flex flex-col items-center justify-center gap-3 p-4">
          <div class="w-12 h-12 rounded-xl bg-violet-600 flex items-center justify-center shadow-lg shadow-violet-900/50">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0 003 10c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.249-8.25-3.286z"/>
            </svg>
          </div>
          <span class="font-display text-xs font-700 text-white text-center leading-tight">SHIELD<br>FORT</span>
        </div>
      </div>

    </div>

    <p class="text-center text-xs text-slate-600 mt-4">Sistema de Gestão Comercial</p>
  </div>

</body>
</html>
